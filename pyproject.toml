[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "helion-diagnostic-research"
version = "0.1.0"
description = "Offline synthetic HBM diagnostic-selection benchmark"
requires-python = ">=3.12"
dependencies = ["numpy==2.3.5", "pandas==2.3.3", "scikit-learn==1.9.0", "scipy==1.16.3", "joblib==1.5.3", "pyarrow==20.0.0", "matplotlib==3.10.0", "nbformat==5.10.4"]

[project.optional-dependencies]
test = ["pytest==9.1.1", "nbconvert==7.17.1"]

[tool.setuptools]
packages = ["helion_pipeline"]

[tool.setuptools.package-data]
helion_pipeline = ["config.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
